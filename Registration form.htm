<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration form</title>
  </head>
  <body>
    <h1>Registration form</h1>
    <form action="">
      Full Name: <input type="text" placeholder="Enter your name" /> <br />
      <br />
      Email: <input type="email" placeholder="Enter your Email" /> <br />
      <br />
      Password: <input type="password" placeholder="Enter password" /> <br />
      <br />
      Mobile Number: <input type="number" placeholder="Enter Mobile number" />
      <br />
      <br />
      Date of Birth: <input type="date" /> <br />
      <br />
      Age: <input type="number" /> <br />
      <br />
      Gender: <input type="radio" value="male" name="gender" />Male
      <input type="radio" value="female" name="gender" /> Female
      <input type="radio" value="Other" name="gender" />Other<br />
      <br />
      Skills: <input type="checkbox" value="HTML" /> HTML
      <input type="checkbox" value="CSS" />CSS
      <input type="checkbox" value="JavaScript" /> JavaScript <br />
      <br />
      Qualification:
      <select name="Qualification" id="">
        <option value="10th">10th</option>
        <option value="Bsc">Bsc</option>
        <option value="Be">BE</option>
      </select>
      <br />
      <br />
      City:
      <select name="City" id="">
        <option value="Pune">Pune</option>
        <option value="Mumbai">Mumbai</option>
        <option value="Nashik">Nashik</option>
      </select>
      <br />
      <br />
      Experience:
      <input type="range" name="experience" id="" min="0" max="10" /> <br />
      <br />
      Address: <br /><textarea name="address" id=""></textarea><br />
      <br />
      Upload Resume: <input type="file" name="" id="" /><br />
      <br />
      Favorite color: <input type="color" name="" id="" /> <br />
      <br />
      Website:
      <input type="url" name="" id="" placeholder="https://example.com" />
      <br />
      <br />
      Preffered Time: <input type="time" name="" id="" /> <br />
      <br />
      <button>Register</button>

      <button>Clear</button>
    </form>
  </body>
</html>
